<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Dr / Cr Reaction · Accounting Game</title>
<style>
:root{color-scheme:light;--ink:#17233c;--muted:#65728a;--blue:#315eea;--line:#e4e9f2;--green:#138457;--red:#cc4350;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:flex;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}.shell{width:min(100%,620px);margin:auto}.brand{font-weight:800;letter-spacing:.02em;font-size:14px;color:var(--blue);margin:0 0 18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,6vw,40px);box-shadow:0 14px 45px #25365a0c}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(27px,7vw,40px);line-height:1.1;letter-spacing:-.04em;margin:10px 0 12px}p{line-height:1.55;color:var(--muted);margin:0 0 22px}.field-label{display:block;font-weight:700;font-size:14px;margin:0 0 8px}input{font:inherit;width:100%;height:54px;border:1px solid #cfd7e5;border-radius:12px;padding:0 15px;font-size:17px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #315eea20}.primary,.answer{border:0;border-radius:13px;font:inherit;font-weight:800;cursor:pointer;touch-action:manipulation}.primary{width:100%;min-height:54px;margin-top:14px;background:var(--blue);color:white;font-size:16px}.primary:active,.answer:active{transform:scale(.985)}button:focus-visible{outline:3px solid #8ba6ff;outline-offset:3px}.error{min-height:20px;margin-top:8px;color:var(--red);font-size:13px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:700}.progress{height:8px;border-radius:99px;background:#edf0f6;margin:15px 0 35px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--blue);border-radius:inherit;transition:width .2s}.prompt{font-size:clamp(25px,7vw,36px);line-height:1.2;text-align:center;margin:12px 0 6px;font-weight:850;letter-spacing:-.035em}.instruction{text-align:center;margin-bottom:27px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{height:clamp(78px,22vw,112px);font-size:clamp(31px,8vw,44px);color:#fff}.answer.dr{background:#315eea}.answer.cr{background:#15233f}.answer:disabled{opacity:.55;cursor:default}.feedback{height:28px;margin:16px 0 0;text-align:center;font-size:16px;font-weight:800}.feedback.ok{color:var(--green)}.feedback.no{color:var(--red)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.stat{border:1px solid var(--line);border-radius:14px;padding:14px}.stat strong{display:block;font-size:23px;margin-top:4px}.stat span{color:var(--muted);font-size:12px;font-weight:650}.missed{border-top:1px solid var(--line);padding-top:16px;margin:12px 0 4px}.missed h2{font-size:15px;margin:0 0 10px}.missed ul{padding-left:19px;margin:0;color:#4e5c73;font-size:14px;line-height:1.7}.empty{color:var(--green);font-weight:700;font-size:14px}.hidden{display:none!important}.gameChoices{display:grid;gap:10px;margin-top:14px}.gameChoice{min-height:58px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit;font-weight:750;text-align:left;padding:12px 16px;cursor:pointer;touch-action:manipulation}.gameChoice span{display:block;color:var(--muted);font-size:12px;font-weight:550;margin-top:3px}.gameChoice.active{background:#315eea;color:white;border-color:#315eea}.gameChoice.active span{color:#e2e9ff}.foot{text-align:center;color:#8a94a7;font-size:12px;margin-top:15px}.secondary{width:100%;min-height:52px;margin-top:10px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font:inherit;font-weight:750;cursor:pointer;touch-action:manipulation}.answerText{margin:20px 0;padding:18px;border-radius:14px;background:#f5f7fb;line-height:1.65}.answerText h2{font-size:15px;color:var(--blue);margin:0 0 8px}.answerText p{color:var(--ink);margin:0 0 14px;white-space:pre-line}.answerText p:last-child{margin-bottom:0}.u2Count{height:52px;margin:4px 0 2px}
</style>
</head>
<body><main class="shell"><div class="brand">ACCOUNTING · QUICK PRACTICE</div>
<section class="card" id="welcome"><div class="eyebrow">CHOOSE A GAME</div><h1>选择游戏</h1><p>输入姓名并选择一个练习入口。</p><label class="field-label" for="studentName">你的姓名</label><input id="studentName" maxlength="40" autocomplete="name" value="david38375" placeholder="输入姓名" aria-describedby="nameError"><div class="gameChoices"><button class="gameChoice active" id="startBtn">Dr / Cr Reaction<span>科目增加或减少时选择 DR / CR · 20 题</span></button><button class="gameChoice" id="u1Btn">会计定义 U1<span>入口已添加 · 待加入 U1 题库</span></button><button class="gameChoice" id="u2Btn">会计定义 U2<span>英中双语简答练习 · 可选 5 或 10 题</span></button></div><div class="error" id="nameError" role="alert"></div></section>
<section class="card hidden" id="u2Setup"><div class="eyebrow">ACCOUNTING DEFINITIONS · U2</div><h1>U2 简答练习</h1><p id="u2PoolInfo"></p><label class="field-label" for="u2Count">本轮题目数量</label><select class="u2Count" id="u2Count"><option value="5">5 题</option><option value="10">10 题</option></select><button class="primary" id="u2Start">开始答题 →</button><button class="secondary" id="u2Home">返回游戏选择</button><div class="error" id="u2SetupError" role="status"></div></section>
<section class="card hidden" id="u2Question"><div class="topline"><span id="u2Player"></span><span id="u2Counter"></span></div><div class="progress"><div id="u2Progress"></div></div><div class="eyebrow">QUESTION</div><div class="prompt" id="u2QuestionText" style="text-align:left;font-size:clamp(22px,6vw,30px)"></div><button class="primary" id="u2Reveal">点击查看答案</button><div class="answerText hidden" id="u2Answer" aria-live="polite"><h2>Answer · English</h2><p id="u2AnswerEn"></p><h2>答案 · 中文</h2><p id="u2AnswerZh"></p></div><button class="primary hidden" id="u2Next">下一题 →</button></section>
<section class="card hidden" id="u2Finish"><div class="eyebrow">ROUND COMPLETE</div><h1>本轮完成</h1><p id="u2FinishInfo"></p><button class="primary" id="u2Keep">保留进度</button><button class="secondary" id="u2Shuffle">重新洗牌</button><button class="secondary" id="u2FinishHome">返回游戏选择</button></section>
<section class="card hidden" id="game" aria-live="polite"><div class="topline"><span id="playerLabel"></span><span id="counter">第 1 / 20 题</span></div><div class="progress" aria-label="答题进度"><div id="progressBar"></div></div><div class="eyebrow" style="text-align:center">ACCOUNT NAME · CHANGE</div><div class="prompt" id="questionText"></div><p class="instruction">Choose the correct side</p><div class="answers"><button class="answer dr" data-answer="DR" aria-label="借方 Debit">DR</button><button class="answer cr" data-answer="CR" aria-label="贷方 Credit">CR</button></div><div class="feedback" id="feedback" role="status" aria-live="assertive"></div></section>
<section class="card hidden" id="results"><div class="eyebrow">ROUND COMPLETE</div><h1 id="resultTitle">完成得很好！</h1><p id="resultSubtitle"></p><div class="stats" id="statsGrid"></div><div class="missed" id="missedWrap"></div><div class="foot">开发者 david38357</div><button class="primary" id="againBtn">再玩一轮</button></section><div class="foot">Accounting Dr / Cr Reaction · V1</div></main>
<script src="questions.js"></script><script src="u2-questions.js"></script><script>
(()=>{'use strict';const TOTAL=20,FEEDBACK_MS=700;const $=id=>document.getElementById(id);const welcome=$('welcome'),game=$('game'),results=$('results'),answerButtons=[...document.querySelectorAll('.answer')];let name='',round=[],index=0,records=[],startedAt=0,roundStartedAt=0,locked=false;
function start(){const raw=$('studentName').value.trim();if(!raw){$('nameError').textContent='请先输入姓名。';$('studentName').focus();return}$('nameError').textContent='';if(!Array.isArray(window.QUESTION_BANK)||window.QUESTION_BANK.length<TOTAL){$('nameError').textContent='题库至少需要 20 道有效题目。';return}name=raw;roundStartedAt=performance.now();round=[...window.QUESTION_BANK].sort(()=>Math.random()-.5).slice(0,TOTAL);index=0;records=[];welcome.classList.add('hidden');results.classList.add('hidden');game.classList.remove('hidden');$('playerLabel').textContent=name;showQuestion()}
function showQuestion(){locked=false;const q=round[index];$('counter').textContent=`第 ${index+1} / ${TOTAL} 题`;$('progressBar').style.width=`${index/TOTAL*100}%`;$('questionText').textContent=`${q.account}  ${q.change==='increase'?'↑':'↓'}`;$('feedback').textContent='';$('feedback').className='feedback';answerButtons.forEach(b=>b.disabled=false);startedAt=performance.now()}
function answer(value){if(locked)return;locked=true;const q=round[index],ms=Math.max(0,performance.now()-startedAt),correct=value===q.answer;records.push({q,selected:value,correct,ms});answerButtons.forEach(b=>b.disabled=true);$('feedback').textContent=correct?'正确 ✓':`不对，正确答案是 ${q.answer}`;$('feedback').className=`feedback ${correct?'ok':'no'}`;setTimeout(()=>{index++;if(index<TOTAL)showQuestion();else showResults()},FEEDBACK_MS)}
function showResults(){game.classList.add('hidden');results.classList.remove('hidden');$('progressBar').style.width='100%';const finishedAt=new Date(),totalMs=performance.now()-roundStartedAt;const correct=records.filter(r=>r.correct).length,rate=Math.round(correct/TOTAL*100),times=records.map(r=>r.ms),avg=times.reduce((a,b)=>a+b,0)/times.length,fast=Math.min(...times),slow=Math.max(...times);let streak=0,best=0;for(const r of records){streak=r.correct?streak+1:0;best=Math.max(best,streak)}$('resultTitle').textContent=rate===100?'完美通关！':rate>=80?'做得很棒！':'本轮完成！';$('resultSubtitle').textContent=`${name}，你答对了 ${correct} / ${TOTAL} 题。答题时间：${finishedAt.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}`;$('statsGrid').innerHTML=[['正确率',`${rate}%`],['总用时',formatTime(totalMs)],['平均反应时间',formatTime(avg)],['最快反应',formatTime(fast)],['最慢反应',formatTime(slow)],['最佳连续答对',`${best} 题`],['答错题目',`${TOTAL-correct} 题`]].map(([a,b])=>`<div class="stat"><span>${a}</span><strong>${b}</strong></div>`).join('');const misses=records.filter(r=>!r.correct);$('missedWrap').innerHTML=`<h2>答错题目（${misses.length}）</h2>`+(misses.length?`<ul>${misses.map(r=>`<li>${escapeHtml(r.q.account)} · ${r.q.change==='increase'?'增加':'减少'} — 你的答案 ${r.selected}，正确答案 ${r.q.answer}</li>`).join('')}</ul>`:'<div class="empty">全部答对，太棒了！</div>')}
const U2_PROGRESS_KEY='accounting-u2-used-v1';let u2Round=[],u2Index=0;const u2Setup=$('u2Setup'),u2Question=$('u2Question'),u2Finish=$('u2Finish');
function readU2Used(){try{const value=JSON.parse(localStorage.getItem(U2_PROGRESS_KEY)||'[]');return new Set(Array.isArray(value)?value:[])}catch(_){return new Set()}}
function hideU2Screens(){u2Setup.classList.add('hidden');u2Question.classList.add('hidden');u2Finish.classList.add('hidden')}
function showU2Setup(){hideU2Screens();u2Setup.classList.remove('hidden');const remaining=window.U2_QUESTION_BANK.filter(q=>!readU2Used().has(q.id)).length;$('u2PoolInfo').textContent=`${name}，未做题库还剩 ${remaining} 题。每轮随机抽题；全部完成后可保留进度或重新洗牌。`; $('u2SetupError').textContent='';$('u2Start').disabled=remaining===0}
function startU2(){const unused=window.U2_QUESTION_BANK.filter(q=>!readU2Used().has(q.id));if(!unused.length){$('u2SetupError').textContent='未做题目已完成，请返回选择“重新洗牌”。';return}const requested=Number($('u2Count').value),count=Math.min(requested,unused.length);u2Round=[...unused].sort(()=>Math.random()-.5).slice(0,count);u2Index=0;u2Setup.classList.add('hidden');u2Finish.classList.add('hidden');u2Question.classList.remove('hidden');$('u2Player').textContent=name;$('u2Answer').classList.add('hidden');$('u2Next').classList.add('hidden');renderU2Question();if(count<requested)$('u2SetupError').textContent=`剩余题目不足 ${requested} 题，本轮将完成剩余的 ${count} 题。`}
function renderU2Question(){const q=u2Round[u2Index];$('u2Counter').textContent=`第 ${u2Index+1} / ${u2Round.length} 题`;$('u2Progress').style.width=`${u2Index/u2Round.length*100}%`;$('u2QuestionText').textContent=q.question;$('u2AnswerEn').textContent=q.en;$('u2AnswerZh').textContent=q.zh;$('u2Answer').classList.add('hidden');$('u2Reveal').classList.remove('hidden');$('u2Next').classList.add('hidden')}
function revealU2Answer(){$('u2Answer').classList.remove('hidden');$('u2Reveal').classList.add('hidden');$('u2Next').classList.remove('hidden')}
function nextU2Question(){u2Index++;if(u2Index<u2Round.length){renderU2Question();return}u2Question.classList.add('hidden');u2Finish.classList.remove('hidden');const remaining=window.U2_QUESTION_BANK.length-readU2Used().size-u2Round.length;$('u2Progress').style.width='100%';$('u2FinishInfo').textContent=`${name}，本轮完成 ${u2Round.length} 题。选择“保留进度”后，下次会从未做题目中抽取；选择“重新洗牌”则清空进度，从全部题目重新抽取。当前预计还剩 ${Math.max(0,remaining)} 道未做题。`}
function keepU2Progress(){const used=readU2Used();u2Round.forEach(q=>used.add(q.id));localStorage.setItem(U2_PROGRESS_KEY,JSON.stringify([...used]));showU2Setup()}
function shuffleU2Pool(){localStorage.removeItem(U2_PROGRESS_KEY);showU2Setup();$('u2SetupError').textContent='题库已重新洗牌；下次将从全部题目中随机抽取。'}
$('u2Start').addEventListener('click',startU2);$('u2Reveal').addEventListener('click',revealU2Answer);$('u2Next').addEventListener('click',nextU2Question);$('u2Keep').addEventListener('click',keepU2Progress);$('u2Shuffle').addEventListener('click',shuffleU2Pool);$('u2Home').addEventListener('click',()=>{hideU2Screens();welcome.classList.remove('hidden')});$('u2FinishHome').addEventListener('click',()=>{hideU2Screens();welcome.classList.remove('hidden')});
function formatTime(ms){return `${(ms/1000).toFixed(2)} 秒`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}answerButtons.forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer)));$('startBtn').addEventListener('click',start);$('u1Btn').addEventListener('click',()=>{$('nameError').textContent='会计定义 U1 入口已添加。请提供 U1 定义或题目内容，以便启用此游戏。'});$('u2Btn').addEventListener('click',()=>{const raw=$('studentName').value.trim();if(!raw){$('nameError').textContent='请先输入姓名。';$('studentName').focus();return}name=raw;$('nameError').textContent='';welcome.classList.add('hidden');showU2Setup()});$('studentName').addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('againBtn').addEventListener('click',()=>{results.classList.add('hidden');welcome.classList.remove('hidden');$('studentName').value='';$('studentName').focus()});})();
</script></body></html>
